# ── Map topology ─────────────────────────────────────────────────────────────
# Real Helsinki city-bike stations (central Helsinki bounding box), built by
# 0_pre_proc.py. Shared across all days in this procdata set — region ids,
# coordinates (projected metres), and region count are the same regardless
# of which day's demand is used.
map:
  type: file
  csv_path: dataset/procdata/metadata.csv

# ── Dynamics ────────────────────────────────────────────────────────────────
dt: 0.25  # time step (hours — demand is in users/hour; 0.25 h = one 15-min cluster)
T:  96    # horizon length — one full day of 15-min demand clusters
