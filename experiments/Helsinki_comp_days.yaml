# ── Map topology ─────────────────────────────────────────────────────────────
# Real Helsinki city-bike stations (central Helsinki bounding box), built by
# 0_pre_proc.py. Map (type/csv_path) plus dt/T are shared dataset-level info,
# defined once in the procdata set's metaparams.yaml rather than per-scenario.
metadata: dataset/procdata/metaparams.yaml

# ── User decision model ───────────────────────────────────────────────────────
# Rewards (5) are in metres: the base cost w_ij of picking up in region i for
# users located in region j is the distance between the two region centres.
# lam_joint: incentive sensitivity λ — metres of walking a full incentive
# (θ_i = 1) compensates. w_le_joint: base cost of leaving w_∅ — metres a user
# tolerates walking without incentives before leaving the service.
# All rewards are divided by tau, which sets how sharply users choose.
lam_joint:   500  # incentive sensitivity λ (metres)
w_le_joint:  100  # base cost of leaving w_∅ (metres)
tau:          50  # entropy regularisation temperature τ (metres)

# ── Cost weights ──────────────────────────────────────────────────────────────
gamma_R: 1.          # incentive cost weight γ_R in (13)
gamma_Q: 10.         # leaving-user cost weight γ_Q in (13)
g_map_type: leaving  # cost model: "leaving" (paper, (13)) or "tracking" (track a desired distribution)

# ── Optimiser hyperparameters ─────────────────────────────────────────────────
phi:      1        # dual gradient step size (KKT sensitivity)
maxIt:    20       # maximum projected-gradient iterations
err_thr:  1.0e-4   # gradient-norm convergence threshold
alph:       1.0    # gradient step size (α_0)
alph_decay: 3.0    # step size decay exponent p: α_k = α_0 / (k+1)^p, need p > 0.5 for Σα_k² < ∞
lp_tol:     1.0e-4   # v-GNE solver tolerance (CLARABEL) or eps (SCS)
solver:     SCS      # v-GNE solver: "CLARABEL" or "SCS"

# ── Projector parameters ──────────────────────────────────────────────────────
th_box:    1          # box projection: per-entry incentive upper bound
projector_type: box   # incentive projection: "box" or "budget"

# ── Naive approach parameters ─────────────────────────────────────────────
trigger_thr: 10        # trigger threshold
trigger_val: 1         # trigger value
proportional_P: 0.1    # proportional gain

# ── Iteration / sweep settings ─────────────────────────────────────────────────
iterates:      True    # whether to sweep over iterate_type
iterate_type:  demand  # which parameter "iterates" sweeps: "th0", "demand" (per-day), or "budget"

# ── Initial  conditions ───────────────────────────────────────────────────────
# scalar → uniform; list of N values → non-uniform.
x0:     10

# ── Initial incentive sequence ────────────────────────────────────────────────
# scalar → uniform; list of N values → non-uniform.
th0:    0

# ── Demand trajectory ─────────────────────────────────────────────────────────
# Real pick-up/drop-off demand (users/hour) per 15-min cluster, from 0_pre_proc.py.
# iterate_type is "demand": sweep the first 10 consecutive days from start_date.
demand:
  type: file
  dir: dataset/procdata
  start_date: 2025-05-01
  n_scenarios: 10
